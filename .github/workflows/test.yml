# The gate: every pull request and every push to master runs the tests and the evals in a headless Chrome.
# master only accepts a pull request when the job below ("tests") is green (see Practice.md).
name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests and evals (headless Chrome)
        shell: pwsh
        run: ./tests/run.ps1
